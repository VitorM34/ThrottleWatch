name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore ThrottleWatch.slnx

      - name: Build
        run: dotnet build ThrottleWatch.slnx -c Release --no-restore

      - name: Test
        run: dotnet test ThrottleWatch.slnx -c Release --no-build --nologo

  pack:
    name: Pack smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Client pack smoke
        run: ./scripts/pack-client-smoke.sh

      - name: Dashboard pack smoke
        run: ./scripts/pack-dashboard-smoke.sh

  ci:
    name: CI
    needs: [test, pack]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require Test and Pack smoke
        run: |
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.pack.result }}" = "success"
